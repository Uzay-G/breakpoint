[project]
name = "breakpoint_eval"
version = "0.1.2"
description = "Breakpoint, an eval on adversarially generated code repair tasks."
requires-python = ">=3.12"
dependencies = [
  "click>=8.2.1",
  "code2flow>=2.5.1",
  "datasets>=3.6.0",
  "gitpython>=3.1.45",
  "inspect-ai>=0.3.119",
  "radon>=6.0.1",
  "scienceplots>=2.1.1",
  "tiktoken>=0.9.0",
  "tqdm>=4.67.1",
  "wandb>=0.21.0",
]

[dependency-groups]
dev = [
  "ipykernel>=6.30.1",
  "ipywidgets>=8.1.7",
  "ruff==0.12.8",
]
anthropic = ["anthropic>=0.62.0"]
openai = ["openai>=1.99.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
default-groups = ["dev", "anthropic", "openai"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff.lint]
select = [
  "F",  # flake8
  "I",  # isort
]
